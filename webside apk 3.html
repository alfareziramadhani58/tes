<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Toko Baju</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      color: #333;
      padding-bottom: 50px;
    }

    header {
      background-color: #1f2937;
      color: #fff;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #e2e8f0;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111827;
    }

    .product-price {
      font-size: 18px;
      color: #e11d48;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .product-desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.4;
      flex-grow: 1;
    }

    .wa-button {
      display: block;
      text-align: center;
      background-color: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .wa-button:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

  <header>
    <h1>Toko Busana Modern</h1>
    <p>Pilih produk favoritmu dan pesan langsung via WhatsApp</p>
  </header>

  <div class="container">
    <div class="product-grid" id="productGrid"></div>
  </div>

  <script>
    const waNumber = "6289540292517";

    const products = [
      {
        id: 1,
        name: "Kaos Polos Oversize Hitam",
        price: 75000,
        description: "Bahan katun combed 24s adem, potongan regular-oversize pria & wanita.",
        image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 2,
        name: "Kemeja Flanel Kotak Casual",
        price: 135000,
        description: "Motif flanel klasik, bahan tebal dan lembut, cocok buat luaran santai.",
        image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 3,
        name: "Hoodie Fleece Basic Abu",
        price: 160000,
        description: "Bahan cotton fleece hangat, saku depan kangguru, tali serut adjustable.",
        image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 4,
        name: "Blouse Wanita Lengan Panjang",
        price: 110000,
        description: "Model flowy anggun bahan crinkle lembut, tidak terawang untuk kasual maupun kerja.",
        image: "https://images.unsplash.com/photo-1564257631407-4deb1f99d992?w=500&auto=format&fit=crop&q=60"
      }
    ];

    function formatRupiah(amount) {
      return "Rp " + amount.toLocaleString("id-ID");
    }

    function createWaUrl(productName, price) {
      const message = `Halo, saya ingin memesan baju:\n\n*Nama Produk:* ${productName}\n*Harga:* ${formatRupiah(price)}\n\nMohon informasi ketersediaan ukuran dan rekening pembayarannya. Terima kasih!`;
      return `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
    }

    const grid = document.getElementById("productGrid");

    products.forEach(item => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <img class="product-image" src="${item.image}" alt="${item.name}">
        <div class="product-info">
          <div class="product-title">${item.name}</div>
          <div class="product-price">${formatRupiah(item.price)}</div>
          <div class="product-desc">${item.description}</div>
          <a class="wa-button" href="${createWaUrl(item.name, item.price)}" target="_blank" rel="noopener noreferrer">
            Beli via WhatsApp
          </a>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
